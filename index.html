<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZEHEN SATHI AI</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <link rel="stylesheet" href="Style.css">
</head>

<body>

<div class="container">

  <div class="app-header">

    <div class="logo">🤖</div>

    <div class="title-area">
      <h2>ZEHEN SATHI AI</h2>

      <small>
        Pi Network کے لیے ذہین AI اسسٹنٹ
      </small>
    </div>

  </div>


  <!-- PI LOGIN -->

  <button id="signin">
    Pi سے Sign In کریں
  </button>

  <p id="status"></p>


  <!-- PI PAYMENT -->

  <div class="payment-box">

    <h3>💰 Pi Testnet Payment</h3>

    <p>
      App کو test کرنے کے لیے 0.01 Testnet Pi ادا کریں۔
    </p>

    <button id="payPi">
      💰 0.01 Pi ادا کریں
    </button>

    <p id="paymentStatus"></p>

  </div>


  <!-- CHAT -->

  <h3>💬 AI Chat</h3>

  <div id="chat" class="chat-box"></div>


  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="اپنا سوال لکھیں..."
    >

    <button id="sendBtn" onclick="sendMessage()">
      📤
    </button>

    <button id="clearBtn" onclick="clearChat()">
      🗑️
    </button>

  </div>

</div>


<script>

const Pi = window.Pi;


/* ==========================================
   PI INIT
========================================== */

Pi.init({
  version: "2.0",
  sandbox: true
});


/* ==========================================
   LOGIN
========================================== */

async function login() {

  try {

    document.getElementById("status").innerHTML =
      "Connecting...";


    const auth = await Pi.authenticate(
      ["username", "payments"],
      onIncompletePaymentFound
    );


    const response = await fetch("/api/auth", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        accessToken: auth.accessToken
      })

    });


    const data = await response.json();


    if (data.success) {

      document.getElementById("status").innerHTML =
        "✅ Welcome <b>" +
        data.user.username +
        "</b>";

    } else {

      document.getElementById("status").innerHTML =
        "❌ Login Verification Failed";

    }


  } catch (error) {

    console.error("Login Error:", error);

    document.getElementById("status").innerHTML =
      "❌ Login Failed";

  }

}


document
  .getElementById("signin")
  .addEventListener("click", login);


/* ==========================================
   INCOMPLETE PAYMENT
========================================== */

async function onIncompletePaymentFound(payment) {

  console.log(
    "Incomplete payment found:",
    payment
  );


  if (
    !payment ||
    !payment.identifier ||
    !payment.transaction ||
    !payment.transaction.txid
  ) {

    return;

  }


  try {

    await fetch("/api/payment/complete", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        paymentId: payment.identifier,

        txid: payment.transaction.txid

      })

    });

  } catch (error) {

    console.error(
      "Incomplete payment error:",
      error
    );

  }

}


/* ==========================================
   CREATE PAYMENT
========================================== */

async function makePayment() {

  const status =
    document.getElementById("paymentStatus");


  status.innerHTML =
    "⏳ Payment تیار ہو رہی ہے...";


  try {

    const paymentData = {

      amount: 0.01,

      memo: "ZEHEN SATHI AI Testnet Payment",

      metadata: {

        app: "zehen-sathi",

        purpose: "developer-test",

        timestamp: Date.now()

      }

    };


    const paymentCallbacks = {


      /* --------------------------------------
         SERVER APPROVAL
      -------------------------------------- */

      onReadyForServerApproval:
        async function(paymentId) {

          console.log(
            "Payment ID:",
            paymentId
          );


          status.innerHTML =
            "⏳ Payment approve ہو رہی ہے...";


          try {

            const response =
              await fetch(
                "/api/payment/approve",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    paymentId: paymentId
                  })

                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              console.error(
                "Approval Error:",
                data
              );


              status.innerHTML =
                "❌ Payment approval failed.";

              return;

            }


            console.log(
              "Payment approved:",
              data
            );


            status.innerHTML =
              "💳 Wallet میں payment confirm کریں...";

          } catch (error) {

            console.error(
              "Approval Error:",
              error
            );


            status.innerHTML =
              "❌ Payment approval میں مسئلہ آیا۔";

          }

        },


      /* --------------------------------------
         SERVER COMPLETION
      -------------------------------------- */

      onReadyForServerCompletion:
        async function(paymentId, txid) {

          console.log(
            "Payment completion:",
            paymentId,
            txid
          );


          status.innerHTML =
            "⏳ Transaction مکمل ہو رہی ہے...";


          try {

            const response =
              await fetch(
                "/api/payment/complete",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({

                    paymentId: paymentId,

                    txid: txid

                  })

                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              console.error(
                "Completion Error:",
                data
              );


              status.innerHTML =
                "❌ Transaction completion failed.";

              return;

            }


            console.log(
              "Payment completed:",
              data
            );


            status.innerHTML =
              "✅ 0.01 Pi Payment کامیابی سے مکمل ہوگئی!";

          } catch (error) {

            console.error(
              "Completion Error:",
              error
            );


            status.innerHTML =
              "❌ Transaction مکمل نہیں ہو سکی۔";

          }

        },


      /* --------------------------------------
         CANCEL
      -------------------------------------- */

      onCancel: function(paymentId) {

        console.log(
          "Payment cancelled:",
          paymentId
        );


        status.innerHTML =
          "❌ Payment cancel کر دی گئی۔";

      },


      /* --------------------------------------
         ERROR
      -------------------------------------- */

      onError: function(error, payment) {

        console.error(
          "Pi Payment Error:",
          error,
          payment
        );


        status.innerHTML =
          "❌ Payment میں مسئلہ آیا۔";

      }

    };


    await Pi.createPayment(
      paymentData,
      paymentCallbacks
    );


  } catch (error) {

    console.error(
      "Create Payment Error:",
      error
    );


    status.innerHTML =
      "❌ Payment شروع نہیں ہو سکی۔";

  }

}


document
  .getElementById("payPi")
  .addEventListener(
    "click",
    makePayment
  );

</script>


<script src="script.js"></script>

</body>
</html>
