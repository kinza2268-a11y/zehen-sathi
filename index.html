
<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEHEN SATHI AI</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="app-header">
    <div class="logo">🤖</div>

    <div class="title-area">
      <h2>ZEHEN SATHI AI</h2>
      <small>Pi Network کے لیے ذہین AI اسسٹنٹ</small>
    </div>
  </div>

  <button id="signin">Pi سے Sign In کریں</button>

  <p id="status"></p>

  <div id="chat" class="chat-box"></div>

  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="اپنا سوال لکھیں...">

    <button id="sendBtn" onclick="sendMessage()">
      📤
    </button>

    <button id="clearBtn" onclick="clearChat()">
      🗑️
    </button>

  </div>

</div>

<script>
Pi.init({
  version: "2.0",
  sandbox: false
});

async function login() {

  try {

    document.getElementById("status").innerHTML = "Connecting...";

    const auth = await Pi.authenticate(
      ["username"],
      function(payment){}
    );

    const response = await fetch("/api/auth", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        accessToken: auth.accessToken
      })
    });

    const data = await response.json();

    if (data.success) {

      document.getElementById("status").innerHTML =
      "✅ Welcome <b>" + data.user.username + "</b>";

    } else {

      document.getElementById("status").innerHTML =
      "❌ Login Verification Failed";

    }

  } catch (e) {

    console.log(e);

    document.getElementById("status").innerHTML =
    "❌ Login Failed";

  }

}

document.getElementById("signin").addEventListener("click", login);
</script>

<script src="script.js"></script>

</body>
</html>
