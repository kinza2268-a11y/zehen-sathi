<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZEHEN SATHI AI</title>

  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="app-header">

      <div class="logo">
        🤖
      </div>

      <div class="title-area">

        <h2>
          ZEHEN SATHI AI
        </h2>

        <small>
          آپ کا ذہین AI ساتھی
        </small>

      </div>

    </div>


    <!-- ============================= -->
    <!-- WELCOME -->
    <!-- ============================= -->

    <div class="welcome-box">

      <h1>
        خوش آمدید! 👋
      </h1>

      <p>
        ZEHEN SATHI AI میں آپ تعلیم، ٹیکنالوجی،
        پروگرامنگ، Pi Network اور عام معلومات
        کے بارے میں سوال پوچھ سکتے ہیں۔
      </p>

    </div>


    <!-- ============================= -->
    <!-- PI LOGIN -->
    <!-- ============================= -->

    <button id="signin">
      🟣 Pi سے Sign In کریں
    </button>

    <p id="status">
      Pi Network سے connect ہونے کے لیے Sign In کریں۔
    </p>


    <!-- ============================= -->
    <!-- CHAT TITLE -->
    <!-- ============================= -->

    <div class="chat-title">
      💬 AI Chat
    </div>


    <!-- ============================= -->
    <!-- CHAT -->
    <!-- ============================= -->

    <div
      id="chat"
      class="chat-box"
    ></div>


    <!-- ============================= -->
    <!-- INPUT -->
    <!-- ============================= -->

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="اپنا سوال لکھیں..."
        autocomplete="off"
      >

      <button
        id="sendBtn"
        onclick="sendMessage()"
        title="Send"
      >
        📤
      </button>

      <button
        id="clearBtn"
        onclick="clearChat()"
        title="Clear Chat"
      >
        🗑️
      </button>

    </div>

  </div>


  <!-- ============================= -->
  <!-- PI LOGIN SCRIPT -->
  <!-- ============================= -->

  <script>

    Pi.init({
      version: "2.0",
      sandbox: false
    });


    async function login() {

      try {

        document.getElementById("status").innerHTML =
          "⏳ Connecting...";


        const auth = await Pi.authenticate(
          ["username"],
          function(payment) {}
        );


        if (!auth || !auth.accessToken) {

          document.getElementById("status").innerHTML =
            "❌ Pi Login ناکام ہو گیا۔";

          return;
        }


        const response = await fetch(
          "/api/auth",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              accessToken:
                auth.accessToken
            })
          }
        );


        const data =
          await response.json();


        if (
          response.ok &&
          data.success &&
          data.user
        ) {

          document.getElementById(
            "status"
          ).innerHTML =
            "✅ Welcome <b>" +
            data.user.username +
            "</b>!";


        } else {

          document.getElementById(
            "status"
          ).innerHTML =
            "❌ Login Verification Failed";

        }

      }

      catch (error) {

        console.error(
          "Pi Login Error:",
          error
        );

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Login Failed";

      }

    }


    document
      .getElementById("signin")
      .addEventListener(
        "click",
        login
      );

  </script>


  <!-- ============================= -->
  <!-- CHAT SCRIPT -->
  <!-- ============================= -->

  <script src="script.js"></script>

</body>

</html>
